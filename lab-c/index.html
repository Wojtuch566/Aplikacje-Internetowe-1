<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Puzzle z lokalizacji</title>
    <link rel="stylesheet/less" href="styles.less" type="text/css">
    <script src="https://cdn.jsdelivr.net/npm/less"></script>

    <link rel="stylesheet" href="leaflet-1.7.1/leaflet.css"/>
    <script src="leaflet-1.7.1/leaflet-src.js"></script>
    <script src="leaflet-1.7.1/leaflet-providers.js"></script>
    <script src="leaflet-1.7.1/leaflet-image.js"></script>
</head>
<body>
    <div id="container">
        <div class="grid-item" id="current-loc"></div>
        <div class="grid-item" id="map-image">
            <canvas id="raster-map" width="320" height="320"></canvas>
        </div>
        <div class="grid-item" id="map-puzzle">
            <canvas class="puzzle-item"></canvas>
            <canvas class="puzzle-item"></canvas>
            <canvas class="puzzle-item"></canvas>
            <canvas class="puzzle-item"></canvas>
            <canvas class="puzzle-item"></canvas>
            <canvas class="puzzle-item"></canvas>
            <canvas class="puzzle-item"></canvas>
            <canvas class="puzzle-item"></canvas>
            <canvas class="puzzle-item"></canvas>
            <canvas class="puzzle-item"></canvas>
            <canvas class="puzzle-item"></canvas>
            <canvas class="puzzle-item"></canvas>
            <canvas class="puzzle-item"></canvas>
            <canvas class="puzzle-item"></canvas>
            <canvas class="puzzle-item"></canvas>
            <canvas class="puzzle-item"></canvas>
        </div>
        <div class="grid-item" id="puzzle-completed">
            <canvas class="puzzle-target"></canvas>
            <canvas class="puzzle-target"></canvas>
            <canvas class="puzzle-target"></canvas>
            <canvas class="puzzle-target"></canvas>
            <canvas class="puzzle-target"></canvas>
            <canvas class="puzzle-target"></canvas>
            <canvas class="puzzle-target"></canvas>
            <canvas class="puzzle-target"></canvas>
            <canvas class="puzzle-target"></canvas>
            <canvas class="puzzle-target"></canvas>
            <canvas class="puzzle-target"></canvas>
            <canvas class="puzzle-target"></canvas>
            <canvas class="puzzle-target"></canvas>
            <canvas class="puzzle-target"></canvas>
            <canvas class="puzzle-target"></canvas>
            <canvas class="puzzle-target"></canvas>
        </div>
    </div>
    <div id="controls">
        <button id="locButton">Moja lokalizacja</button>
        <button id="styleButton">Zmień styl mapy</button>
        <button id="saveButton">Pobierz mapę</button>
    </div>
    <script type="text/javascript" src="puzzle.js"></script>
</body>
</html>
