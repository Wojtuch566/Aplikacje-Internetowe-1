<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Weather Report</title>
    <link rel="stylesheet/less" type="text/css" href="styles.less"/>
    <script src="https://cdn.jsdelivr.net/npm/less"></script>
</head>
<body>
    <h1>Weather Report</h1>
    <div id="weather-search-box">
        <input type="text" id="weatherLocation">
        <button id="weatherCheck">Zobacz aktualną pogodę</button>
    </div>
    <div id="weather-currentTime">
        <div class="weather-date">12.12.2024</div>
        <div class="weather-date-hour">20:00</div>
        <div class="weather-temperature">0 &deg;C</div>
        <div class="weather-temperature-feels-like">-2 &deg;C</div>
        <img class="weather-icon" src="https://openweathermap.org/img/wn/13n@2x.png">
        <div class="weather-description">opady śniegu</div>
    </div>
    <div id="weather-dayTime">
        <h2>Reszta dnia</h2>
        <div class="weather-hourTime"></div>
        <div class="weather-hourTime"></div>
        <div class="weather-hourTime"></div>
        <div class="weather-hourTime"></div>
        <div class="weather-hourTime"></div>
        <div class="weather-hourTime"></div>
        <div class="weather-hourTime"></div>
        <div class="weather-hourTime"></div>
        <div class="weather-hourTime"></div>
        <div class="weather-hourTime"></div>
        <div class="weather-hourTime"></div>
        <div class="weather-hourTime"></div>
        <div class="weather-hourTime"></div>
        <div class="weather-hourTime"></div>
        <div class="weather-hourTime"></div>
        <div class="weather-hourTime"></div>
        <div class="weather-hourTime"></div>
        <div class="weather-hourTime"></div>
        <div class="weather-hourTime"></div>
        <div class="weather-hourTime"></div>
        <div class="weather-hourTime"></div>
        <div class="weather-hourTime"></div>
        <div class="weather-hourTime"></div>
        <div class="weather-hourTime"></div>
    </div>
    <script src="pogodynka.js"></script>
</body>
</html>
